
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnowShot | TK</title>

  <style>
    body {
      background: #14141c;
      color: #e8e8f0;
      font-family: sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.7;
    }

    h1, h2 {
      color: #5ee0ff;
    }

    .game-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #222630;
      border: 1px solid #5ee0ff;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 24px;
    }

    section {
      background: #1d1d29;
      border: 1px solid #343b4a;
      border-radius: 10px;
      padding: 20px;
      margin-top: 24px;
    }

    h2 {
      border-bottom: 1px solid #343b4a;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    a {
      display: inline-block;
      color: #5ee0ff;
      text-decoration: none;
      border: 1px solid #5ee0ff;
      border-radius: 6px;
      padding: 8px 16px;
      transition: 0.2s;
    }

    a:hover {
      background: #5ee0ff;
      color: #14141c;
    }

    @media (max-width: 600px) {
      body { padding: 16px; }
      section { padding: 16px; }
    }
  </style>
</head>

<body>

<h1>SnowShot</h1>

<a href="../index.html">トップページに戻る</a>

<div class="game-image">
  <p>スクリーンショット準備中</p>
</div>

<section>
  <h2>ゲーム内容</h2>
  <p>
    次々と出現してくる敵に雪玉を生成して投げ、
    倒していく3Dアクションゲームです。
  </p>
  <p>
    最終的にボスが出現し、ボスを倒すとゲームクリアになります。
  </p>
</section>

<section>
  <h2>制作情報</h2>
  <p>使用技術：Unreal Engine / Blueprint</p>
  <p>制作人数：1人</p>
  <p>担当：すべて</p>
  <p>補足：オブジェクトやUIはUnreal Engine標準のものを使用</p>
</section>

<section>
  <h2>ゲームリンク</h2>
  <p>現在準備中です。</p>
</section>

</body>
</html>
