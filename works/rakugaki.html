
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>めっちゃラクガキ | TK</title>

  <style>
    body {
      background: #14141c;
      color: #e8e8f0;
      font-family: sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.7;
    }

    h1, h2 { color: #5ee0ff; }

    .game-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #222630;
      border: 1px solid #5ee0ff;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 24px;
    }

    section {
      background: #1d1d29;
      border: 1px solid #343b4a;
      border-radius: 10px;
      padding: 20px;
      margin-top: 24px;
    }

    h2 {
      border-bottom: 1px solid #343b4a;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    a {
      display: inline-block;
      color: #5ee0ff;
      text-decoration: none;
      border: 1px solid #5ee0ff;
      border-radius: 6px;
      padding: 8px 16px;
      transition: 0.2s;
    }

    a:hover {
      background: #5ee0ff;
      color: #14141c;
    }

    @media (max-width: 600px) {
      body { padding: 16px; }
      section { padding: 16px; }
    }

    .game-images {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 40px;
}

.game-images img {
  width: calc((100% - 32px) / 3);
  max-width: 260px;
  height: auto;
  object-fit: contain;
  border-radius: 8px;
}

  </style>
</head>

<body>

<h1>めっちゃラクガキ</h1>

<a href="../index.html">トップページに戻る</a>

<div class="game-images">
  <img src="../images/rakugaki-images/rakugaki1.png" alt="ラクガキモード">
  <img src="../images/rakugaki-images/rakugaki2.png" alt="描いた線を登る場面">
  <img src="../images/rakugaki-images/rakugaki3.png" alt="カメラ・視点変更">
</div>

<section>
  <h2>ゲーム内容</h2>
  <p>
    ステージ上に隠された3つの鍵を探し、
    ラクガキを用いて脱出を目指す3Dアクションゲームです。
  </p>
  <p>
    制限時間は5分間で、ラクガキできる量にも制限があります。
  </p>
</section>

<section>
  <h2>制作情報</h2>
  <p>使用技術：Unity / C#</p>
  <p>制作人数：1人</p>
  <p>担当：すべて</p>
  <p>補足：オブジェクトはUnity標準のものを使い、仕組みづくりに集中しました。</p>
</section>

<section>
  <h2>ゲームリンク</h2>
  <p>現在準備中です。</p>
</section>

</body>
</html>
