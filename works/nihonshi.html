
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日本史クイズ | TK</title>

  <style>
    body {
      background: #14141c;
      color: #e8e8f0;
      font-family: sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.7;
    }

    h1, h2 { color: #5ee0ff; }

    .game-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #222630;
      border: 1px solid #5ee0ff;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 24px;
    }

    section {
      background: #1d1d29;
      border: 1px solid #343b4a;
      border-radius: 10px;
      padding: 20px;
      margin-top: 24px;
    }

    h2 {
      border-bottom: 1px solid #343b4a;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    a {
      display: inline-block;
      color: #5ee0ff;
      text-decoration: none;
      border: 1px solid #5ee0ff;
      border-radius: 6px;
      padding: 8px 16px;
      transition: 0.2s;
    }

    a:hover {
      background: #5ee0ff;
      color: #14141c;
    }

    @media (max-width: 600px) {
      body { padding: 16px; }
      section { padding: 16px; }
    }

.game-images {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}

.game-images img {
  width: calc((100% - 32px) / 3);
  max-width: 260px;
  height: auto;
  object-fit: contain;
  border-radius: 8px;
}

.game-images {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 40px;
}

  </style>
</head>

<body>

<h1>日本史クイズ</h1>

<a href="../index.html">トップページに戻る</a>

<div class="game-images">
    <img src="../images/nihonshi-quiz-images/nihonshi-quiz1.png" alt="ホーム画面">
    <img src="../images/nihonshi-quiz-images/nihonshi-quiz2.png" alt="クイズ画面">
    <img src="../images/nihonshi-quiz-images/nihonshi-quiz3.png" alt="正当、解説画面">

<section>
  <h2>ゲーム内容</h2>
  <p>
    ブラウザで遊べる4択形式の日本史クイズゲームです。
  </p>
  <p>
    複数のモードを搭載しており、
    自分に合った学び方で日本史を楽しめます。
  </p>
</section>

<section>
  <h2>制作情報</h2>
  <p>使用技術：React / Vite / TypeScript</p>
  <p>制作人数：3人（プログラマー1人、プランナー2人）</p>
  <p>担当：プログラム全般</p>
  <p>補足：2026年11月時点で制作中です。</p>
</section>

<section>
  <h2>ゲームリンク</h2>
  <p>
    <a href="https://nihonshi-quiz-haiteku.vercel.app/" target="_blank" rel="noopener noreferrer">
      日本史クイズを開く
    </a>
  </p>
</section>

</body>
</html>
